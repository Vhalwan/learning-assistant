<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Redirecting...</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        align-items: center;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        font: 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
      }

      main {
        text-align: center;
      }

      h1 {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0;
        margin: 0;
      }

      p {
        color: #64748b;
        margin: 0.5rem 0 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Redirecting...</h1>
      <p id="fallback-message"></p>
    </main>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const next = params.get("next") || params.get("redirect_to") || "";
        const fallbackMessage = document.getElementById("fallback-message");

        if (!next) {
          fallbackMessage.textContent = "Missing app redirect target.";
          return;
        }

        let targetUrl;
        try {
          targetUrl = new URL(next);
        } catch (error) {
          fallbackMessage.textContent = "Invalid app redirect target.";
          return;
        }

        const authParams = new URLSearchParams();
        const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));

        hashParams.forEach((value, key) => {
          authParams.set(key, value);
        });

        params.forEach((value, key) => {
          if (key !== "next" && key !== "redirect_to") {
            authParams.set(key, value);
          }
        });

        authParams.forEach((value, key) => {
          targetUrl.searchParams.set(key, value);
        });

        window.location.replace(targetUrl.toString());
      })();
    </script>
  </body>
</html>
